<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfolio | Wekesa Cornelius</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
:root{--gold:#ffc107;--bg:#050b24;--panel:#08102f;--line:#1c2a66;--text:#f5f7ff;--mute:#b4bce0}
[data-theme=light]{--bg:#f3f5ff;--panel:#fff;--line:#d3daf5;--text:#0b1236;--mute:#4a5580}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth;scroll-padding-top:80px}
body{background:var(--bg);color:var(--text);font:400 16px/1.6 "Poppins","Segoe UI",system-ui,sans-serif}
a{color:inherit;text-decoration:none}img{max-width:100%;display:block}
.wrap{max-width:1200px;margin:auto;padding:0 24px}
nav{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
nav .wrap{display:flex;align-items:center;gap:20px;height:80px}
.brand{display:flex;align-items:center;gap:14px;margin-right:auto;font-size:1.4rem;font-weight:600;line-height:1.1;white-space:pre-line}
.brand img,.brand svg{height:48px;width:auto}
.links{display:flex;gap:28px;font-weight:500;font-size:0.95rem}
.links a{padding:6px 0;border-bottom:3px solid transparent;transition:.2s}
.links a:hover,.links a.on{color:var(--gold);border-color:var(--gold)}
.btn{display:inline-flex;align-items:center;gap:10px;border:1.5px solid var(--text);border-radius:999px;padding:12px 26px;font:600 0.95rem "Poppins",sans-serif;cursor:pointer;background:none;color:var(--text);transition:.2s}
.btn:hover{transform:translateY(-2px)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#1a1300}
.btn.sm{padding:9px 20px;font-size:0.88rem}
.icon-btn{background:none;border:1px solid var(--line);color:var(--text);border-radius:10px;width:42px;height:42px;cursor:pointer;font-size:1rem}
#burger{display:none}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
section{padding:80px 0}
h2{font-size:2.2rem;font-weight:700;line-height:1.2}
h2 b{color:var(--gold)}
.sub{color:var(--mute);margin:8px 0 36px;font-size:1.1rem}
.head.c{text-align:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:24px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;transition:.25s}
.card:hover{border-color:var(--gold);transform:translateY(-4px)}
.card h3{font-size:1.15rem;font-weight:600;margin-bottom:8px}
.card p{color:var(--mute);font-size:0.95rem}
.th{aspect-ratio:16/10;width:100%;object-fit:cover;background:linear-gradient(135deg,#1320b8,#6d28d9);display:grid;place-items:center;font-size:2.5rem;color:rgba(255,255,255,.5)}
.body{padding:18px 20px 22px}
.body .v{color:var(--gold);font-weight:600;font-size:0.9rem;display:inline-flex;gap:8px;align-items:center;margin-top:12px}
.filters{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-bottom:30px}
.filters button{background:none;border:1px solid var(--line);color:var(--text);padding:8px 22px;border-radius:999px;cursor:pointer;font:500 0.9rem "Poppins",sans-serif}
.filters button.on{background:var(--gold);border-color:var(--gold);color:#1a1300;font-weight:600}
footer{border-top:1px solid var(--line);padding:28px 0;text-align:center;color:var(--mute);font-size:0.9rem}
@media(max-width:900px){
 .links{display:none;position:absolute;top:80px;left:0;right:0;background:var(--bg);flex-direction:column;gap:8px;padding:16px 24px 20px;border-bottom:1px solid var(--line)}
 .links.open{display:flex}#burger{display:block}nav .btn{display:none}
}
</style>
</head>
<body>
<nav><div class="wrap">
 <a href="index.html" class="brand" aria-label="Home">
  <svg viewBox="0 0 56 48" fill="none" stroke="#ffc107" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 40C8 14 24 4 42 6"/><path d="M16 42L31 14l16 28"/></svg>
  <span>Cornelius &<br>Associates</span>
 </a>
 <div class="links" id="links">
  <a href="index.html">Home</a><a href="about.html">About</a><a href="portfolio.html" class="on">Projects</a><a href="services.html">Services</a><a href="portfolio.html" class="on">Portfolio</a><a href="blog.html">Blog</a><a href="contact.html">Contact</a>
 </div>
 <a class="btn gold sm" href="contact.html"><i class="fa-solid fa-paper-plane"></i> Hire Me</a>
 <button class="icon-btn" id="theme" aria-label="Toggle theme"><i class="fa-solid fa-sun"></i></button>
 <button class="icon-btn" id="burger" aria-label="Menu"><i class="fa-solid fa-bars"></i></button>
</div></nav>

<section><div class="wrap">
 <div class="head c"><h2>My <b>Portfolio</b></h2><p class="sub">A showcase of my recent work</p></div>
 <div class="filters" id="filters"></div>
 <div class="grid" id="projectGrid"><p class="sub" style="grid-column:1/-1;text-align:center;">Loading projects…</p></div>
</div></section>

<footer>© <span id="yr"></span> Cornelius & Associates. All rights reserved.</footer>

<script type="module">
import { db } from "./firebase.js";
import { collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const $ = id => document.getElementById(id);
const mk = (t, c, x) => { const e = document.createElement(t); if (c) e.className = c; if (x != null) e.textContent = x; return e; };
const ico = (cls) => { const i = mk("i"); i.className = cls; return i; };
$("yr").textContent = new Date().getFullYear();

const card = (p) => { 
  const c = mk("article", "card"); 
  let im; 
  if (p.img) { 
    im = mk("img", "th"); 
    im.src = p.img; 
    im.alt = p.title; 
    im.loading = "lazy"; 
  } else { 
    im = mk("div", "th"); 
    im.append(ico("fa-solid fa-laptop-code")); 
  }
  const b = mk("div", "body"); 
  b.append(mk("h3", "", p.title), mk("p", "", p.desc));
  if (p.link) { 
    const a = mk("a", "v", "View Project "); 
    a.href = p.link; 
    a.target = "_blank"; 
    a.rel = "noopener"; 
    a.append(ico("fa-solid fa-arrow-right")); 
    b.append(a); 
  }
  c.append(im, b); 
  return c; 
};

try {
  const items = (await getDocs(query(collection(db, "projects"), orderBy("order")))).docs.map(d => d.data());
  if (items.length === 0) {
    $("projectGrid").innerHTML = '<p class="sub" style="grid-column:1/-1;text-align:center;">No projects added yet.</p>';
  } else {
    const cats = ["All", ...new Set(items.map(p => p.category).filter(Boolean))];
    const draw = cat => { 
      $("projectGrid").replaceChildren(); 
      const l = items.filter(p => cat === "All" || p.category === cat); 
      if (!l.length) $("projectGrid").innerHTML = '<p class="sub" style="grid-column:1/-1;text-align:center;">No projects in this category.</p>';
      l.forEach(p => $("projectGrid").append(card(p))); 
    };
    cats.forEach((c, i) => { 
      const b = mk("button", i ? "" : "on", c); 
      b.onclick = () => { 
        document.querySelectorAll("#filters button").forEach(x => x.classList.remove("on")); 
        b.classList.add("on"); 
        draw(c); 
      }; 
      $("filters").append(b); 
    });
    draw("All");
  }
} catch (e) {
  $("projectGrid").innerHTML = '<p class="sub" style="grid-column:1/-1;text-align:center;">Could not load projects. Please check your connection.</p>';
}

$("burger").onclick = () => $("links").classList.toggle("open");
$("links").onclick = () => $("links").classList.remove("open");
$("theme").onclick = () => { 
  const r = document.documentElement, d = r.dataset.theme === "dark"; 
  r.dataset.theme = d ? "light" : "dark"; 
  $("theme").firstChild.className = d ? "fa-solid fa-moon" : "fa-solid fa-sun"; 
};
window.addEventListener('offline', () => { window.location.href = 'offline.html'; });
</script>
</body>
</html>
