<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page Not Found | Wekesa Cornelius</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
:root{--gold:#ffc107;--bg:#050b24;--panel:#08102f;--line:#1c2a66;--text:#f5f7ff;--mute:#b4bce0}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--text);font:400 16px/1.6 "Poppins","Segoe UI",system-ui,sans-serif;display:flex;align-items:center;justify-content:center;min-height:100vh;text-align:center;padding:20px}
a{color:inherit;text-decoration:none}
.wrap{max-width:600px;display:flex;flex-direction:column;align-items:center}
.icon-box{width:120px;height:120px;background:rgba(255,193,7,0.1);border:2px solid var(--gold);border-radius:50%;display:grid;place-items:center;margin-bottom:30px}
.icon-box i{font-size:4rem;color:var(--gold)}
h1{font-size:4rem;font-weight:700;color:var(--gold);line-height:1;margin-bottom:10px}
h2{font-size:1.8rem;font-weight:600;margin-bottom:16px}
p{color:var(--mute);font-size:1.1rem;margin-bottom:30px;max-width:400px}
.btn{display:inline-flex;align-items:center;gap:12px;border:2px solid var(--text);border-radius:999px;padding:14px 32px;font:600 1rem "Poppins",sans-serif;cursor:pointer;background:none;color:var(--text);transition:.2s}
.btn:hover{transform:translateY(-3px)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:#1a1300}
</style>
</head>
<body>
<div class="wrap">
  <div class="icon-box"><i class="fa-solid fa-ghost"></i></div>
  <h1>404</h1>
  <h2>Page Not Found</h2>
  <p>The page you are looking for does not exist. It might have been moved or deleted.</p>
  <a href="index.html" class="btn gold"><i class="fa-solid fa-house"></i> Back to Home</a>
</div>
</body>
</html>
